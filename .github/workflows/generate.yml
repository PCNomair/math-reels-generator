name: Generate Math Reels

on:
  workflow_dispatch: # يتيح تشغيل السكربت يدوياً بضغطة زر للتجربة
  schedule:
    - cron: '0 8 * * *' # يعمل تلقائياً كل يوم الساعة 8:00 صباحاً UTC

jobs:
  run-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generator.py

      - name: Upload Generated Output
        uses: actions/upload-artifact@v4
        with:
          name: daily-reels-output
          path: output/
